version: 2
updates:
  # Dependabot does not update the taiki-e `tool:` versions or the
  # dtolnay/rust-toolchain master pin: bump those by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
