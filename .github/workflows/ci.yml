name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push cancels a pull request run. Push runs on main are never
# cancelled: the release workflow needs the complete result of every merge
# commit (scripts/release-ci-status.sh).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-24
        with:
          toolchain: nightly
          components: rustfmt
      - run: cargo fmt --all --check
      - name: Package contents
        run: scripts/check-package.sh
      - name: fuzz.sh argument checks
        run: scripts/test-fuzz-args.sh
      - name: release-ci-status.sh checks
        run: scripts/test-release-ci-status.sh

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-24
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install krb5 and OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libssl-dev pkg-config
      # Default features: catches leftovers behind `cfg(not(feature = ...))`.
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-24
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.135
      - name: Run tests
        run: cargo nextest run --locked
      - name: Run doc tests
        run: cargo test --doc --locked

  test-kerberos:
    name: Test (kerberos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-24
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.135
      - name: Install libkrb5-dev
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev
      - run: cargo nextest run --locked --features kerberos
      - run: cargo test --doc --locked --features kerberos

  test-credssp:
    # The `credssp` feature needs OpenSSL headers. `__internal` also builds
    # tests/proptest_wire_format.rs and replays its committed seeds. The release
    # check compiles the `cfg(not(debug_assertions))` branches that no test
    # build reaches.
    name: Test (credssp)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-24
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.135
      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      # tests/pwsh_quote_oracle.rs skips itself without pwsh; this step makes
      # a runner without it fail visibly.
      - run: pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - run: cargo nextest run --locked --features credssp,__internal
      - run: cargo test --doc --locked --features credssp
      - name: Release build check (release-only branches)
        run: cargo check --locked --release --lib --features credssp

  kerberos-windows:
    # The SSPI branch of cross-krb5 (and the `cfg(windows)` wrap code of
    # src/auth/kerberos.rs) only compiles on Windows; no Kerberos test runs
    # here (no KDC), this checks that the code builds and lints clean.
    name: Kerberos (windows, check + clippy)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-24
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --locked --all-targets --features kerberos
      - run: cargo clippy --locked --all-targets --features kerberos -- -D warnings

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-24
        with:
          toolchain: 1.98.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov@0.8.7
      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      # Runs with the `credssp` feature, so the CredSSP code is measured and
      # gated too.
      - name: Generate coverage
        run: cargo llvm-cov --locked --features credssp --summary-only --fail-under-lines 95
      # Reuses the profile data of the run above: no rebuild. The feature list
      # must match that run, or the report would come from a different build.
      - name: Cobertura report for SonarQube Cloud
        run: cargo llvm-cov report --features credssp --cobertura --output-path cobertura.xml
      - name: Keep cobertura.xml for the sonar job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-cobertura
          path: cobertura.xml
          if-no-files-found: error
          retention-days: 1

  # SonarQube Cloud (CI-based analysis: Automatic Analysis skips Rust). Imports
  # the llvm-cov coverage and a Clippy report; settings in
  # sonar-project.properties. Dependabot and fork PRs get no SONAR_TOKEN, so
  # the job is skipped for them. Third-party actions are pinned to full commit
  # SHAs because this job handles a secret.
  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs: coverage
    # The scanner authenticates with SONAR_TOKEN, not with the GitHub token.
    permissions:
      contents: read
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    env:
      # The workflow-level `-D warnings` would stop the report at the first
      # warning; it must list every one. Blocking on lints stays the job of
      # `clippy`.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: Sonar needs blame data to tell new code from old.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-24
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-cobertura
      - name: Clippy report (JSON)
        run: |
          cargo clippy --locked --all-targets --features credssp --message-format=json -- \
            -W clippy::unwrap_used -W clippy::expect_used -W clippy::panic \
            -W clippy::todo -W clippy::unimplemented -W clippy::indexing_slicing \
            -W clippy::arithmetic_side_effects -W clippy::as_conversions \
            > clippy-report.json
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-24
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The `kerberos` feature pulls `cross-krb5` which needs krb5 dev
      # headers (gssapi.h) to build its `libgssapi-sys` bindings; `credssp`
      # needs the OpenSSL headers.
      - name: Install krb5 and OpenSSL dev headers
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libssl-dev pkg-config
      - name: SECURITY.md lists the current minor
        run: |
          minor=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "winrm-rs") | .version' | cut -d. -f1,2)
          grep -Fq "| ${minor}.x" SECURITY.md \
            || { echo "::error file=SECURITY.md::no '| ${minor}.x' row under Supported versions"; exit 1; }
      - run: cargo doc --locked --no-deps --all-features

  hardening:
    # Informatif : compte les violations des lints durcis (rust-hardening.md).
    # Ne bloque jamais ; à rendre bloquant quand les compteurs sont à zéro.
    name: Hardening (informatif)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-24
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Lints durcis (comptage)
        run: |
          cargo clippy --locked --message-format=short -- \
            -W clippy::unwrap_used -W clippy::expect_used -W clippy::panic -W clippy::todo -W clippy::unimplemented -W clippy::indexing_slicing -W clippy::arithmetic_side_effects -W clippy::as_conversions 2> hardening.txt || true
          {
            echo '### Lints durcis (non bloquant)'
            echo '```'
            sed -nE 's/^[^ ]+ (warning|error): //p' hardening.txt | sort | uniq -c | sort -rn
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  vet:
    name: cargo vet
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-vet@0.10.2
      - run: cargo vet --locked

  msrv:
    name: MSRV (1.98.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-24
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - run: cargo check --locked --all-targets
      - run: cargo check --locked --all-targets --features credssp

  deny:
    name: Dependency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.19.6
      # Also checks the RustSec advisories (deny.toml `[advisories]`).
      - run: cargo deny --all-features --locked check

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-24
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          # The cargo-fuzz install below must run every time: a cached
          # ~/.cargo/bin would satisfy it and the version pin would prove nothing.
          cache-bin: "false"
      # NOT `taiki-e/install-action@cargo-fuzz`: that branch is an unmaintained
      # 2024-03 snapshot that resolves, exits in 19ms and installs nothing, and
      # cargo-fuzz is no longer in the action's tool manifest. `cargo install`
      # is slower but cannot silently no-op.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz@0.13.1 --locked
      - name: Install OpenSSL headers (credssp feature)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Build every target
        run: scripts/fuzz.sh build
      # Deterministic: replays the committed seeds plus whatever the caches
      # hold. Fails only when a known input has started to crash.
      - name: Replay seed corpora
        run: scripts/fuzz.sh smoke
      # Short mutation budget per target — enough to catch an obviously broken
      # invariant on a PR. The real campaign runs nightly in fuzz.yml.
      - name: Fuzz each target briefly
        run: FUZZ_TIME=20 scripts/fuzz.sh run
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  semver:
    name: Semver check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-24
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # cargo-semver-checks builds the default feature group, which includes
      # `credssp` (OpenSSL) and `kerberos` (krb5).
      - name: Install krb5 and OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libssl-dev pkg-config
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          # Use the 1.98.0 toolchain installed above, not a floating stable.
          rust-toolchain: manual

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: zizmor@1.31.1
      # Online: the token enables the audits that query GitHub (impostor
      # commits, ref confusion, actions with published advisories, ref/comment
      # mismatch). Any finding fails the job.
      - run: zizmor .
        env:
          GH_TOKEN: ${{ github.token }}

  # Gate job — add this to branch protection rules
  ci-pass:
    name: CI passed
    if: always()
    needs:
      - fmt
      - clippy
      - test
      - test-kerberos
      - test-credssp
      - kerberos-windows
      - coverage
      - doc
      - msrv
      - deny
      - fuzz
      - semver
      - workflow-lint
      - vet
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # Every job in `needs` must succeed; `semver` may be skipped (it runs on
      # pull requests only). A job added to `needs` is covered with no edit here.
      - name: Verify all jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'to_entries | all(.value.result == "success" or (.key == "semver" and .value.result == "skipped"))' <<<"$NEEDS" >/dev/null \
            || { echo "::error::One or more required jobs did not succeed"; exit 1; }
