name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - name: Package contents
        run: scripts/check-package.sh
      - name: fuzz.sh argument checks
        run: scripts/test-fuzz-args.sh

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (kerberos)
        run: |
          sudo apt-get update && sudo apt-get install -y libkrb5-dev
          cargo clippy --all-targets --features kerberos -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Run tests
        run: cargo nextest run
      - name: Run doc tests
        run: cargo test --doc

  test-kerberos:
    name: Test (kerberos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Install libkrb5-dev
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev
      - run: cargo nextest run --features kerberos
      - run: cargo test --doc --features kerberos

  kerberos-windows:
    # The SSPI branch of cross-krb5 (and the `cfg(windows)` wrap code of
    # src/auth/kerberos.rs) only compiles on Windows; no Kerberos test runs
    # here (no KDC), this checks that the code builds and lints clean.
    name: Kerberos (windows, check + clippy)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets --features kerberos
      - run: cargo clippy --locked --all-targets --features kerberos -- -D warnings

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --locked --lcov --output-path lcov.info --fail-under-lines 95
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
      # Reuses the profile data of the run above: no rebuild.
      - name: Cobertura report for SonarQube Cloud
        run: cargo llvm-cov report --cobertura --output-path cobertura.xml
      - name: Keep cobertura.xml for the sonar job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-cobertura
          path: cobertura.xml
          if-no-files-found: error
          retention-days: 1

  # SonarQube Cloud (CI-based analysis: Automatic Analysis skips Rust). Imports
  # the llvm-cov coverage and a Clippy report; settings in
  # sonar-project.properties. Dependabot and fork PRs get no SONAR_TOKEN, so
  # the job is skipped for them. Third-party actions are pinned to full commit
  # SHAs because this job handles a secret.
  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs: coverage
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    env:
      # The workflow-level `-D warnings` would stop the report at the first
      # warning; it must list every one. Blocking on lints stays the job of
      # `clippy`.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: Sonar needs blame data to tell new code from old.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-cobertura
      - name: Clippy report (JSON)
        run: |
          cargo clippy --locked --all-targets --features credssp --message-format=json -- \
            -W clippy::unwrap_used -W clippy::expect_used -W clippy::panic \
            -W clippy::todo -W clippy::unimplemented -W clippy::indexing_slicing \
            -W clippy::arithmetic_side_effects -W clippy::as_conversions \
            > clippy-report.json
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      # The `kerberos` feature pulls `cross-krb5` which needs krb5 dev
      # headers (gssapi.h) to build its `libgssapi-sys` bindings.
      - name: Install krb5 dev headers
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev
      - run: cargo doc --no-deps --all-features

  hardening:
    # Informatif : compte les violations des lints durcis (rust-hardening.md) et
    # vérifie la baseline cargo-vet. Ne bloque jamais ; à rendre bloquant
    # quand les compteurs sont à zéro.
    name: Hardening (informatif)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-vet@0.10.2
      - name: Lints durcis (comptage)
        run: |
          cargo clippy --locked --message-format=short -- \
            -W clippy::unwrap_used -W clippy::expect_used -W clippy::panic -W clippy::todo -W clippy::unimplemented -W clippy::indexing_slicing -W clippy::arithmetic_side_effects -W clippy::as_conversions 2> hardening.txt || true
          {
            echo '### Lints durcis (non bloquant)'
            echo '```'
            sed -nE 's/^[^ ]+ (warning|error): //p' hardening.txt | sort | uniq -c | sort -rn
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: cargo vet (baseline d'exemptions)
        run: cargo vet --locked

  msrv:
    name: MSRV (1.98.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: Dependency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      # NOT `taiki-e/install-action@cargo-fuzz`: that branch is an unmaintained
      # 2024-03 snapshot that resolves, exits in 19ms and installs nothing, and
      # cargo-fuzz is no longer in the action's tool manifest. `cargo install`
      # is slower but cannot silently no-op; rust-cache keeps ~/.cargo/bin
      # warm across runs.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Install OpenSSL headers (credssp feature)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Build every target
        run: scripts/fuzz.sh build
      # Deterministic: replays the committed seeds plus whatever the caches
      # hold. Fails only when a known input has started to crash.
      - name: Replay seed corpora
        run: scripts/fuzz.sh smoke
      # Short mutation budget per target — enough to catch an obviously broken
      # invariant on a PR. The real campaign runs nightly in fuzz.yml.
      - name: Fuzz each target briefly
        run: FUZZ_TIME=20 scripts/fuzz.sh run
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  semver:
    name: Semver check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Install libkrb5-dev
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev
      - uses: obi1kenobi/cargo-semver-checks-action@v2

  # Gate job — add this to branch protection rules
  ci-pass:
    name: CI passed
    if: always()
    needs:
      - fmt
      - clippy
      - test
      - test-kerberos
      - kerberos-windows
      - coverage
      - doc
      - msrv
      - audit
      - deny
      - fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        run: |
          results=( \
            "${{ needs.fmt.result }}" \
            "${{ needs.clippy.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.test-kerberos.result }}" \
            "${{ needs.kerberos-windows.result }}" \
            "${{ needs.coverage.result }}" \
            "${{ needs.doc.result }}" \
            "${{ needs.msrv.result }}" \
            "${{ needs.audit.result }}" \
            "${{ needs.deny.result }}" \
            "${{ needs.fuzz.result }}" \
          )
          for r in "${results[@]}"; do
            if [[ "$r" != "success" ]]; then
              echo "::error::One or more required jobs failed"
              exit 1
            fi
          done
          echo "All required jobs passed"
