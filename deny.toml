[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
    { crate = "core-foundation@0.9.4", reason = "doublon transitif (hyper-util client-proxy-system, dev-dependency Windows du test proxy OS ; system-configuration macOS), version plus ancienne ; revue avant 2027-04-25" },
    { crate = "getrandom@0.2.17", reason = "doublon transitif, version plus ancienne ; revue avant 2027-01-19" },
    { crate = "shlex@1.3.0", reason = "doublon transitif (bindgen via cross-krb5), version plus ancienne ; revue avant 2027-01-19" },
    { crate = "syn@2.0.119", reason = "doublon transitif, version plus ancienne ; revue avant 2027-01-19" },
    { crate = "windows-sys@0.52.0", reason = "doublon transitif, version plus ancienne ; revue avant 2027-01-19" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
