[package]
name = "winrm-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.98.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
base64 = "0.23"

[dependencies.winrm-rs]
path = ".."
# `__internal` exposes `winrm_rs::__fuzz`; `credssp` is what compiles the
# ASN.1/DER code the `fuzz_asn1_*` targets exercise.
features = ["__internal", "credssp"]

# Fuzz builds keep debug assertions and overflow checks on: the parsers here
# do a lot of offset arithmetic and a silent wrap is exactly the class of bug
# these targets exist to catch.
[profile.release]
debug = 1
debug-assertions = true
overflow-checks = true

