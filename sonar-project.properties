# SonarQube Cloud, analysed by the `sonar` job of .github/workflows/ci.yml.
# SonarCloud's Automatic Analysis skips Rust: keep it disabled
# (Administration > Analysis Method), the two analysis methods conflict.
sonar.organization=muchiny
sonar.projectKey=muchiny_winrm-rs
sonar.projectName=winrm-rs
sonar.sourceEncoding=UTF-8

# Scope. Main code: the crate, the examples, the fuzz targets, the scripts and
# the workflows (GitHub Actions rules). Out of scope: docs/, supply-chain/,
# the Vagrant boxes under tests/.
sonar.sources=src,examples,fuzz/fuzz_targets,scripts,.github
sonar.tests=tests
# Test helpers that live under src/ (`#[cfg(test)]` modules): test code, so
# not analysed as main code.
sonar.exclusions=src/test_pki.rs,src/test_ntlm_server.rs,src/test_proxy.rs
sonar.test.exclusions=tests/vagrant/**

# Coverage: cobertura.xml comes from `cargo llvm-cov` (`coverage` job). The
# examples, fuzz targets, scripts and workflows have no coverage report:
# without this exclusion they would count as 0 % and fail the quality gate.
sonar.rust.cobertura.reportPaths=cobertura.xml
sonar.coverage.exclusions=examples/**,fuzz/**,scripts/**,.github/**

# Clippy issues (default lints + hardened lints), written by the `clippy-report`
# job. The scanner only imports this file; it does not run clippy.
sonar.rust.clippyReport.reportPaths=clippy-report.json
